# Netlify: the app is a static export. Build in app/, publish app/out.
[build]
  base = "app"
  command = "npm run build"
  publish = "out"

# Single-page-ish navigation: every route has its own html, but let deep
# links to a route without .html resolve.
[[redirects]]
  from = "/dumps"
  to = "/dumps.html"
  status = 200
[[redirects]]
  from = "/library"
  to = "/library.html"
  status = 200
[[redirects]]
  from = "/program"
  to = "/program.html"
  status = 200
[[redirects]]
  from = "/export"
  to = "/export.html"
  status = 200
